<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verifiable Elm</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
      * { box-sizing: border-box; }
      .verdict-PASS { color: #15803d; }
      .verdict-FAIL { color: #b91c1c; }
      .verdict-BLOCKED { color: #b45309; }
      .verdict-SKIP { color: #6b7280; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; font-size: 14px; }
      code { background: #11182708; padding: 1px 4px; border-radius: 3px; }
      a { color: #2563eb; }

      /* Visually-hidden but readable by screen readers (used by the form label). */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      /* --- Todo app: just enough to read as a todo list, nothing fancy. --- */
      .todo-app { max-width: 30rem; margin: 2rem auto; padding: 0 1rem; }
      .todo-app h1 { font-size: 1.5rem; margin: 0 0 1rem; }

      .add-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      .add-form input { flex: 1; padding: 0.5rem; font-size: 1rem; border: 1px solid #9ca3af; border-radius: 4px; }
      .add-form button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }

      .filters { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
      .filters button { padding: 0.25rem 0.75rem; cursor: pointer; }
      .filters button:disabled { font-weight: 600; cursor: default; }

      .todo-list { list-style: none; padding: 0; margin: 0; }
      .todo-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #e5e7eb; }
      .todo-item label { display: flex; align-items: center; gap: 0.5rem; flex: 1; cursor: pointer; }
      .todo-item input[type="checkbox"]:checked + .todo-text { text-decoration: line-through; opacity: 0.55; }
      .todo-item button { border: 0; background: none; cursor: pointer; color: #9ca3af; font-size: 1rem; }
      .todo-item button:hover { color: #b91c1c; }

      .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 0.875rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/elm.js"></script>
    <script>
      // ---------------------------------------------------------------------
      // The agent handle.  Elm has no globals, so we bridge window.__verify
      // to the Elm runtime over two ports.  Each method sends a request string
      // and resolves the promise when Elm answers on verifyResponse.
      // ---------------------------------------------------------------------
      const app = Elm.Main.init({ node: document.getElementById("app") });
      const pending = {};

      function request(kind) {
        return new Promise((resolve) => {
          (pending[kind] = pending[kind] || []).push(resolve);
          app.ports.verifyRequest.send(kind);
        });
      }

      app.ports.verifyResponse.subscribe(({ kind, data }) => {
        const waiters = pending[kind] || [];
        pending[kind] = [];
        waiters.forEach((resolve) => resolve(data));
      });

      window.__verify = {
        version: 1,
        manifest: () => request("manifest"),
        current: () => request("current"),
        runAll: () => request("runAll"),
      };
    </script>
  </body>
</html>
